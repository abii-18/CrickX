global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: cricx-spark
    static_configs:
      - targets: [spark:9101]
  - job_name: cricx-producer
    static_configs:
      - targets: [simulator:9102]
