groups:
  - name: cricx
    rules:
      - alert: CricXProducerUnavailable
        expr: up{job="cricx-producer"} == 0
        for: 30s
        labels: {severity: warning}
        annotations: {summary: "Simulator metrics endpoint is unavailable"}
      - alert: CricXProducerSendFailed
        expr: increase(cricx_producer_errors_total[2m]) > 0
        labels: {severity: warning}
        annotations: {summary: "Kafka send failed; simulator paused for explicit recovery"}
      - alert: CricXProcessorUnavailable
        expr: up{job="cricx-spark"} == 0
        for: 30s
        labels: {severity: critical}
        annotations: {summary: "CricX Spark metrics endpoint is unavailable"}
      - alert: CricXSinkErrors
        expr: increase(cricx_sink_errors_total[2m]) > 0
        labels: {severity: warning}
        annotations: {summary: "Canonical sink transaction failed; inspect recovery"}
      - alert: CricXBacklog
        expr: sum(cricx_spark_backlog_records) > 100
        for: 30s
        labels: {severity: warning}
        annotations: {summary: "Spark has a sustained event backlog"}
