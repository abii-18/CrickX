name: cricx
services:
  kafka-volume-init:
    image: apache/kafka:3.9.0
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 1000:1000 /tmp/kraft-combined-logs"]
    volumes: ["kafka-data:/tmp/kraft-combined-logs"]
  kafka:
    image: apache/kafka:3.9.0
    depends_on:
      kafka-volume-init: {condition: service_completed_successfully}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_LOG_RETENTION_HOURS: 6
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    ports: ["127.0.0.1:9092:9092"]
    volumes: ["kafka-data:/tmp/kraft-combined-logs"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:29092", "--create", "--if-not-exists", "--topic", "match-events", "--partitions", "3", "--replication-factor", "1"]
  postgres:
    image: postgres:16.8
    environment:
      POSTGRES_DB: cricx
      POSTGRES_USER: cricx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cricx -d cricx"]
      interval: 5s
      timeout: 5s
      retries: 12
  spark:
    build: {context: ., dockerfile: spark/Dockerfile}
    environment:
      DATABASE_URL: postgresql://cricx:${POSTGRES_PASSWORD}@postgres:5432/cricx
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    volumes: ["checkpoints:/checkpoints", "ivy-cache:/tmp/ivy"]
    restart: on-failure
  producer:
    build: .
    entrypoint: ["python", "-m", "producer.replay"]
    profiles: ["tools"]
    environment: {KAFKA_BOOTSTRAP: "kafka:29092"}
    depends_on:
      kafka-init: {condition: service_completed_successfully}
  test:
    build: .
    profiles: ["tools"]
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
    environment:
      CRICX_TEST_DATABASE_URL: postgresql://cricx:${POSTGRES_PASSWORD}@postgres:5432/cricx
    depends_on:
      postgres: {condition: service_healthy}
  dashboard:
    build: .
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0"]
    environment:
      DATABASE_URL: postgresql://cricx:${POSTGRES_PASSWORD}@postgres:5432/cricx
      SIMULATOR_URL: http://simulator:9700
    ports: ["127.0.0.1:8501:8501"]
    depends_on:
      postgres: {condition: service_healthy}
  simulator:
    build: .
    command: ["python", "-m", "producer.service"]
    environment: {KAFKA_BOOTSTRAP: "kafka:29092"}
    volumes: ["simulator-state:/state"]
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    restart: on-failure
  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=6h"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro", "metrics-data:/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["grafana-data:/var/lib/grafana", "./monitoring/grafana:/etc/grafana/provisioning:ro"]
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: ["./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro", "alertmanager-data:/alertmanager"]
volumes:
  kafka-data:
  postgres-data:
  checkpoints:
  ivy-cache:
  metrics-data:
  grafana-data:
  simulator-state:
  alertmanager-data:
